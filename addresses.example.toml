# Запасний варіант керування адресами (бот у /add робить те саме без редагування файлів).
# Записи звідси синхронізуються в базу при старті сервісу, у боті вони позначені 🔒.
# Видалив запис із файлу — після перезапуску підписка зникне.

[[address]]
name = "Дім"                 # як підписувати адресу в повідомленнях
street_id = "123456"         # streetId (див. README)
house = "12"
send_to = "tg"               # tg | slack (для slack потрібен SLACK_TOKEN; зручніше: /slack у боті)
target = "-1001553812345"    # chat_id для tg або ID каналу для slack
graphs = true                # слати картинку з графіком (необов'язково)
silent = true                # без звуку (необов'язково)
events = true                # слати погодинні відключення (необов'язково)
queue = "1.1"                # лише ця підчерга ГПВ, 1.1 … 6.2 (необов'язково)

